services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scbap}
      POSTGRES_USER: ${POSTGRES_USER:-scbap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scbap} -d ${POSTGRES_DB:-scbap}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./scbap-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-scbap}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scbap}
      ALLOWED_ORIGINS: ${PUBLIC_APP_URL}
      HTTPS: ${HTTPS:-false}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-scbap_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
      AUTH_COOKIE_MAX_AGE_MS: ${AUTH_COOKIE_MAX_AGE_MS:-43200000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      PORTAIL_JWT_SECRET: ${PORTAIL_JWT_SECRET}
      PORTAIL_JWT_EXPIRES_IN: ${PORTAIL_JWT_EXPIRES_IN:-12h}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-5}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-scbap-documents}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      DAPG_BASE_URL: ${DAPG_BASE_URL}
      DAPG_API_KEY: ${DAPG_API_KEY}
      BIOMETRIE_API_BASE_URL: ${BIOMETRIE_API_BASE_URL}
      BIOMETRIE_API_KEY: ${BIOMETRIE_API_KEY}
      BIOMETRIE_APPLICATION: ${BIOMETRIE_APPLICATION:-siope}
      BIOMETRIE_DEEP_LINK_APP: ${BIOMETRIE_DEEP_LINK_APP:-}
      BIOMETRIE_MANY: ${BIOMETRIE_MANY:-yes}
      BIOMETRIE_TIMEOUT_MS: ${BIOMETRIE_TIMEOUT_MS:-30000}
      BIOMETRIE_DEBUG: ${BIOMETRIE_DEBUG:-false}
      NFC_DETENUS_URL: ${NFC_DETENUS_URL}
      NFC_TIMEOUT_MS: ${NFC_TIMEOUT_MS:-60000}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-scbap-backend-prod}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TELEMETRY_TOPIC: ${MQTT_TELEMETRY_TOPIC:-scbap/bracelets/telemetry}
      MQTT_EVENTS_TOPIC: ${MQTT_EVENTS_TOPIC:-scbap/bracelets/events}
      MQTT_STATUS_TOPIC: ${MQTT_STATUS_TOPIC:-scbap/bracelets/status}
      MQTT_CONFIG_TOPIC: ${MQTT_CONFIG_TOPIC:-scbap/bracelets/config}
      MQTT_DEBUG: ${MQTT_DEBUG:-false}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SCBAP}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Africa/Porto-Novo}
      PORTAIL_BASE_URL: ${PUBLIC_APP_URL}/portail
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./scbap-frontend
      args:
        VITE_API_URL: /api
        VITE_SURVEILLANCE_WS_URL: ${PUBLIC_WS_URL:-}
        VITE_APP_TIME_ZONE: ${APP_TIME_ZONE:-Africa/Porto-Novo}
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
